<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9B8CFF"/>
      <stop offset="100%" stop-color="#7C6DF0"/>
    </linearGradient>
    <linearGradient id="topGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B3A5FF"/>
      <stop offset="100%" stop-color="#9B8CFF"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1EEFF"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- dark background -->
  <rect x="0" y="0" width="512" height="512" rx="0" fill="#181524"/>
  <circle cx="256" cy="256" r="240" fill="#211D34"/>

  <!-- paper coming out the top -->
  <rect x="176" y="120" width="160" height="110" rx="10" fill="url(#paperGrad)" stroke="#E4DEFF" stroke-width="4"/>
  <rect x="200" y="150" width="112" height="10" rx="5" fill="#D9D2FF"/>
  <rect x="200" y="172" width="90" height="10" rx="5" fill="#D9D2FF"/>
  <rect x="200" y="194" width="70" height="10" rx="5" fill="#D9D2FF"/>

  <!-- printer body group -->
  <g filter="url(#softShadow)">
    <!-- main body -->
    <rect x="120" y="220" width="272" height="160" rx="36" fill="url(#bodyGrad)"/>
    <!-- top slot deck -->
    <rect x="140" y="200" width="232" height="50" rx="20" fill="url(#topGrad)"/>
    <!-- paper slot -->
    <rect x="196" y="212" width="120" height="14" rx="7" fill="#5B4CD6"/>

    <!-- face plate -->
    <rect x="150" y="258" width="212" height="120" rx="28" fill="#F5F3FF"/>

    <!-- eyes -->
    <circle cx="216" cy="312" r="15" fill="#3A2E85"/>
    <circle cx="296" cy="312" r="15" fill="#3A2E85"/>
    <circle cx="221" cy="306" r="4.5" fill="#FFFFFF"/>
    <circle cx="301" cy="306" r="4.5" fill="#FFFFFF"/>

    <!-- rosy cheeks -->
    <circle cx="190" cy="336" r="10" fill="#FFB4C6" opacity="0.8"/>
    <circle cx="322" cy="336" r="10" fill="#FFB4C6" opacity="0.8"/>

    <!-- happy smile -->
    <path d="M 236 340 Q 256 362 276 340" stroke="#3A2E85" stroke-width="7" fill="none" stroke-linecap="round"/>

    <!-- little feet -->
    <rect x="150" y="374" width="34" height="20" rx="10" fill="#5B4CD6"/>
    <rect x="328" y="374" width="34" height="20" rx="10" fill="#5B4CD6"/>

    <!-- side buttons -->
    <circle cx="150" cy="270" r="8" fill="#FFD166"/>
    <circle cx="150" cy="292" r="8" fill="#FF8FA3"/>
  </g>

  <!-- printed photo sliding out the bottom, little polaroid nod -->
  <rect x="206" y="378" width="100" height="80" rx="6" fill="#FFFFFF" stroke="#E4DEFF" stroke-width="4"/>
  <rect x="216" y="388" width="80" height="52" rx="3" fill="#C9C1FF"/>
</svg>
